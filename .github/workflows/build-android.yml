name: Build CanteenLedger Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  android-debug:
    name: Build offline Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Use GitHub runner Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER" || { echo "::error::Android SDK command tools unavailable"; exit 1; }
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version
          if [ ! -d "$SDK_ROOT/platforms/android-36" ] || [ ! -d "$SDK_ROOT/build-tools/36.0.0" ]; then
            "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
          fi
      - name: Install Capacitor dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Package completely offline website
        run: npm run build
      - name: Generate Android platform
        run: npx cap add android
      - name: Sync Capacitor plugins and assets
        run: npx cap sync android
      - name: Install Android icon and splash artwork
        run: python3 tools/patch_android.py
      - name: Verify branded launcher resources
        shell: bash
        run: |
          test -s android/app/src/main/res/drawable-nodpi/canteen_launcher_foreground.png
          grep -q 'canteen_launcher_foreground' android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          grep -q 'canteen_launcher_foreground' android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          echo 'CanteenLedger launcher icon resources verified.'
      - name: Compile Android debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Verify compiled app identity
        shell: bash
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$APK" | grep -E '^(package:|application-label:|application-icon-)' | head -15
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: CanteenLedger-v4-Branded-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
